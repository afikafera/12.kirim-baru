<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk — ARAN</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem; background: #101827; color: #eef2fa; font: 16px/1.5 system-ui, sans-serif; }
    main { width: min(100%, 26rem); padding: 2rem; border: 1px solid #35445c; border-radius: 1rem; background: #192537; }
    h1 { margin: 0 0 .25rem; }
    p { color: #b9c6d8; }
    label { display: block; margin: 1rem 0 .35rem; }
    input { width: 100%; padding: .75rem; border: 1px solid #7890ad; border-radius: .5rem; font: inherit; }
    button { width: 100%; margin-top: 1.5rem; padding: .8rem; border: 0; border-radius: .5rem; background: #78b8ff; color: #0c1828; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    [role="alert"] { min-height: 1.5rem; color: #ffb7b7; }
  </style>
</head>
<body>
  <main>
    <h1>ARAN</h1>
    <p>Masuk untuk menggunakan asisten riset.</p>
    <form id="login-form">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="login-button" type="submit">Masuk</button>
      <p id="login-error" role="alert" aria-live="polite"></p>
    </form>
  </main>
  <script>
    "use strict";
    const form = document.getElementById("login-form");
    const button = document.getElementById("login-button");
    const error = document.getElementById("login-error");

    fetch("/auth/me", { credentials: "same-origin", cache: "no-store" })
      .then(response => { if (response.ok) window.location.replace("/app"); })
      .catch(() => {});

    form.addEventListener("submit", async event => {
      event.preventDefault();
      error.textContent = "";
      button.disabled = true;
      const passwordInput = document.getElementById("password");
      const payload = {
        username: document.getElementById("username").value,
        password: passwordInput.value
      };
      try {
        const response = await fetch("/auth/login", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        passwordInput.value = "";
        payload.password = "";
        if (!response.ok) {
          error.textContent = "Login gagal. Periksa username dan password.";
          return;
        }
        const session = await fetch("/auth/me", {
          credentials: "same-origin",
          cache: "no-store"
        });
        if (!session.ok) {
          error.textContent = "Session tidak tersedia. Coba lagi.";
          return;
        }
        window.location.replace("/app");
      } catch (_) {
        error.textContent = "Tidak dapat menghubungi ARAN. Coba lagi.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
